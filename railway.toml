# Railway Configuration for Sports Holics Backend
# This file is at the ROOT of your repository

[build]
  builder = "NIXPACKS"
  buildCommand = "cd backend/sportsholics-cms && npm install && npm run build"
  
[deploy]
  startCommand = "cd backend/sportsholics-cms && npm start"
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10

# Note: We use 'cd' commands to navigate to the backend directory
# This way Railway knows to build from backend/sportsholics-cms

